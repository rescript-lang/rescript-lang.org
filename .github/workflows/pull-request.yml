name: Pull Request
on: [pull_request]
jobs:
  Format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Format check
        run: yarn ci:format
  Site_Checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Test examples and hrefs
        run: yarn test
  Wrangler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Build ReScript
        run: yarn build:res
      - name: Validate Wrangler Pages runtime
        working-directory: apps/docs
        run: |
          yarn wrangler pages dev public --port 8788 > wrangler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8788/favicon.ico > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat wrangler.log
          exit 1
  Vitest:
    runs-on: ubuntu-latest
    container:
      # Keep this image tag aligned with package.json's playwright version.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Build ReScript
        run: yarn build:res
      - name: Vitest
        run: yarn ci:test
  Visual_Regression:
    runs-on: ubuntu-latest
    container:
      # Keep this image tag aligned with package.json's playwright version.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Build ReScript
        run: yarn build:res
      - name: Visual regression tests
        run: yarn ci:test:visual
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            apps/docs/.vitest-attachments
